name: CI
on: [push, pull_request]
jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - run: python -m pip install --upgrade pip pytest numpy torch torchvision pyyaml opencv-python-headless scikit-learn
      - run: python -m compileall -q scripts src
      - run: PYTHONPATH=src pytest -q tests
